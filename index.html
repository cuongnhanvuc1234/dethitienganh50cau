<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thử Thách Tiếng Anh Siêu Nhí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #FFD84D;
    --sky: #7CCBFF;
    --pink: #FF8FB1;
    --mint: #6FDCAE;
    --ink: #2B3A67;
    --paper: #FFF8E8;
    --white: #FFFFFF;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Baloo 2', 'Comic Sans MS', system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 8% 12%, #FFE7A0 0 70px, transparent 71px),
      radial-gradient(circle at 92% 18%, #C4EBFF 0 90px, transparent 91px),
      radial-gradient(circle at 85% 92%, #FFD0E0 0 80px, transparent 81px),
      radial-gradient(circle at 12% 90%, #C9F5E1 0 70px, transparent 71px);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  .wrap { width: 100%; max-width: 560px; }
  .card {
    background: var(--white);
    border: 3px solid var(--ink);
    border-radius: 28px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 24px;
    margin-bottom: 20px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(1.9rem, 6vw, 2.5rem);
    font-weight: 800;
    line-height: 1.1;
    text-align: center;
  }
  .sub { text-align: center; margin: 0 0 18px; font-size: 1.1rem; font-weight: 500; }
  .hero { font-size: 3.2rem; text-align: center; letter-spacing: 6px; }
  .hero span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .hero span:nth-child(2) { animation-delay: .2s; }
  .hero span:nth-child(3) { animation-delay: .4s; }
  .hero span:nth-child(4) { animation-delay: .6s; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  .btn {
    font: inherit;
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--ink);
    background: var(--sun);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 12px 26px;
    box-shadow: 4px 4px 0 var(--ink);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.block { display: block; width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; }

  input[type="text"] {
    font: inherit;
    font-size: 1.2rem;
    width: 100%;
    padding: 12px 16px;
    border: 3px solid var(--ink);
    border-radius: 16px;
    color: var(--ink);
    margin-bottom: 16px;
  }

  .note { text-align: center; margin: 14px 0 0; font-size: 1rem; }

  .progress {
    height: 16px;
    background: #EEF2FF;
    border: 3px solid var(--ink);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .progress div { height: 100%; background: var(--mint); width: 0; transition: width .3s; }
  .meta { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 14px; }

  .prompt { text-align: center; padding: 8px 0 14px; }
  .prompt .q { font-size: 1.3rem; font-weight: 700; margin: 0 0 10px; }
  .prompt .big { font-size: 6rem; line-height: 1.1; }
  .prompt .word {
    font-size: 3rem;
    font-weight: 800;
    color: var(--ink);
    background: var(--sky);
    border: 3px solid var(--ink);
    border-radius: 20px;
    display: inline-block;
    padding: 8px 22px;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .speak {
    font: inherit;
    font-size: 1.2rem;
    font-weight: 700;
    margin-top: 12px;
    background: var(--white);
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 6px 18px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
  }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt {
    font: inherit;
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--ink);
    background: var(--white);
    border: 3px solid var(--ink);
    border-radius: 20px;
    min-height: 74px;
    padding: 8px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .08s, box-shadow .08s, background-color .2s;
  }
  .opt.emoji { font-size: 2.8rem; }
  .opt:hover:not(:disabled) { background: #FFF3C4; }
  .opt:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .opt.correct { background: var(--mint) !important; }
  .opt.wrong { background: var(--pink) !important; }
  .opt:disabled { cursor: default; }

  .feedback { min-height: 28px; text-align: center; font-size: 1.3rem; font-weight: 800; margin: 16px 0 8px; }
  .feedback.ok { color: #13805A; }
  .feedback.no { color: #C2185B; }

  .score-big { font-size: 5rem; font-weight: 800; text-align: center; margin: 4px 0 0; line-height: 1; }
  .score-big small { font-size: 2rem; }
  .stars { text-align: center; font-size: 2.4rem; letter-spacing: 4px; margin: 10px 0; }
  .detail { text-align: center; font-size: 1.2rem; margin: 6px 0 0; }
  .msg { text-align: center; font-size: 1.5rem; font-weight: 800; margin: 8px 0 0; }

  .hidden { display: none !important; }

  :focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }

  @media (max-width: 380px) {
    .options { grid-template-columns: 1fr; }
    .prompt .big { font-size: 5rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="intro">
    <div class="hero" aria-hidden="true"><span>🐱</span><span>🍎</span><span>⭐</span><span>🚗</span></div>
    <h1>Thử Thách Tiếng Anh Siêu Nhí</h1>
    <p class="sub">Đề thi dành cho bé lớp 2 · 50 câu · thang điểm 10</p>
    <input type="text" id="name" placeholder="Tên bé là gì? (không bắt buộc)" maxlength="20" aria-label="Tên của bé">
    <button class="btn block" id="startBtn">Bắt đầu làm bài 🚀</button>
    <p class="note">Bé bấm nút 🔊 để nghe cách phát âm nhé!</p>
  </div>

  <div class="card hidden" id="quiz">
    <div class="meta"><span id="counter"></span><span id="correctCount"></span></div>
    <div class="progress" aria-hidden="true"><div id="bar"></div></div>
    <div class="prompt" id="prompt"></div>
    <div class="options" id="options"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
    <div style="text-align:center">
      <button class="btn hidden" id="nextBtn">Câu tiếp theo</button>
    </div>
  </div>

  <div class="card hidden" id="result">
    <h1>Kết quả của bé</h1>
    <p class="score-big" id="scoreBig"></p>
    <p class="detail" id="scoreDetail"></p>
    <div class="stars" id="stars"></div>
    <p class="msg" id="resultMsg"></p>
    <div style="text-align:center; margin-top:18px">
      <button class="btn" id="retryBtn">Làm đề mới 🔄</button>
    </div>
  </div>
</div>

<script>
  // 50 words for grade 2: [English word, picture]
  const VOCAB = [
    ['cat', '🐱'], ['dog', '🐶'], ['fish', '🐟'], ['bird', '🐦'], ['cow', '🐮'],
    ['pig', '🐷'], ['duck', '🦆'], ['rabbit', '🐰'], ['horse', '🐴'], ['lion', '🦁'],
    ['monkey', '🐵'], ['elephant', '🐘'], ['bear', '🐻'], ['frog', '🐸'], ['tiger', '🐯'],
    ['apple', '🍎'], ['banana', '🍌'], ['orange', '🍊'], ['grape', '🍇'], ['strawberry', '🍓'],
    ['watermelon', '🍉'], ['pear', '🍐'], ['lemon', '🍋'], ['red', '🔴'], ['blue', '🔵'],
    ['yellow', '🟡'], ['green', '🟢'], ['black', '⚫'], ['white', '⚪'], ['purple', '🟣'],
    ['brown', '🟤'], ['ball', '⚽'], ['book', '📖'], ['pencil', '✏️'], ['bag', '🎒'],
    ['car', '🚗'], ['bus', '🚌'], ['house', '🏠'], ['sun', '☀️'], ['moon', '🌙'],
    ['star', '⭐'], ['tree', '🌳'], ['flower', '🌸'], ['eye', '👁️'], ['hand', '✋'],
    ['ear', '👂'], ['nose', '👃'], ['cake', '🎂'], ['ice cream', '🍦'], ['milk', '🥛']
  ];

  const $ = id => document.getElementById(id);
  let questions = [], cur = 0, score = 0, answered = false;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.8;
    speechSynthesis.speak(u);
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function buildQuestions() {
    return shuffle([...VOCAB]).map((item, i) => {
      const type = i % 2 === 0 ? 'pic2word' : 'word2pic';
      const others = shuffle(VOCAB.filter(v => v !== item)).slice(0, 3);
      return { item, type, opts: shuffle([item, ...others]) };
    });
  }

  function show(id, visible) { $(id).classList.toggle('hidden', !visible); }

  function start() {
    questions = buildQuestions();
    cur = 0; score = 0;
    show('intro', false); show('result', false); show('quiz', true);
    render();
  }

  function render() {
    const q = questions[cur];
    answered = false;
    $('counter').textContent = `Câu ${cur + 1}/${questions.length}`;
    $('correctCount').textContent = `Đúng: ${score}`;
    $('bar').style.width = `${(cur / questions.length) * 100}%`;
    $('feedback').textContent = '';
    $('feedback').className = 'feedback';
    show('nextBtn', false);
    $('nextBtn').textContent = cur === questions.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo';

    const prompt = $('prompt');
    prompt.innerHTML = '';
    const options = $('options');
    options.innerHTML = '';

    if (q.type === 'pic2word') {
      prompt.appendChild(el('p', 'q', 'Đây là gì?'));
      prompt.appendChild(el('div', 'big', q.item[1]));
      prompt.appendChild(el('p', 'q', 'Chọn từ tiếng Anh đúng nhé!'));
    } else {
      prompt.appendChild(el('p', 'q', 'Hình nào đúng với từ này?'));
      prompt.appendChild(el('div', 'word', q.item[0]));
      const sp = el('button', 'speak', '🔊 Nghe lại');
      sp.type = 'button';
      sp.setAttribute('aria-label', 'Nghe lại từ ' + q.item[0]);
      sp.onclick = () => speak(q.item[0]);
      prompt.appendChild(sp);
    }

    q.opts.forEach(opt => {
      const isPic = q.type === 'word2pic';
      const b = el('button', 'opt' + (isPic ? ' emoji' : ''), isPic ? opt[1] : opt[0]);
      b.type = 'button';
      b.onclick = () => choose(b, opt);
      options.appendChild(b);
    });

    if (q.type === 'word2pic') speak(q.item[0]);
  }

  function choose(btn, opt) {
    if (answered) return;
    answered = true;
    const q = questions[cur];
    const correct = opt === q.item;
    if (correct) score++;

    const buttons = [...$('options').children];
    buttons.forEach(b => b.disabled = true);
    btn.classList.add(correct ? 'correct' : 'wrong');
    if (!correct) {
      const idx = q.opts.indexOf(q.item);
      buttons[idx].classList.add('correct');
    }

    const fb = $('feedback');
    fb.textContent = correct
      ? 'Đúng rồi! Giỏi quá! 🎉'
      : `Chưa đúng, đáp án là "${q.item[0]}" 💪`;
    fb.className = 'feedback ' + (correct ? 'ok' : 'no');
    $('correctCount').textContent = `Đúng: ${score}`;

    speak(q.item[0]);
    show('nextBtn', true);
  }

  function nextStep() {
    if (cur < questions.length - 1) {
      cur++;
      render();
    } else {
      finish();
    }
  }

  function finish() {
    show('quiz', false);
    show('result', true);
    $('bar').style.width = '100%';
    const diem = score / 5; // 50 câu, mỗi câu 0,2 điểm
    const text = Number.isInteger(diem) ? String(diem) : diem.toFixed(1).replace('.', ',');
    $('scoreBig').innerHTML = `${text}<small> / 10</small>`;
    $('scoreDetail').textContent = `Bé trả lời đúng ${score}/${questions.length} câu`;
    const filled = Math.round(diem / 2);
    $('stars').textContent = '⭐'.repeat(filled) + '☆'.repeat(5 - filled);

    const name = $('name').value.trim();
    const who = name ? `${name} ơi, ` : '';
    let msg;
    if (diem >= 9) msg = `${who}xuất sắc! Bé giỏi quá! 🏆`;
    else if (diem >= 7) msg = `${who}giỏi lắm, sắp đạt điểm tuyệt đối rồi! 🌟`;
    else if (diem >= 5) msg = `${who}khá tốt, cố gắng thêm nhé! 👍`;
    else msg = `${who}cố lên, bé làm lại sẽ tiến bộ thôi! 💪`;
    $('resultMsg').textContent = msg;
  }

  $('startBtn').onclick = start;
  $('nextBtn').onclick = nextStep;
  $('retryBtn').onclick = start;
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !$('nextBtn').classList.contains('hidden')) nextStep();
  });
</script>
</body>
</html>
